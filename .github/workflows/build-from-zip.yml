name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download ZIP
        uses: actions/checkout@v4

      - name: Select newest Android ZIP by versionCode and extract project
        shell: bash
        run: |
          set -e

          echo "=== SEARCH FOR ANDROID ZIP FILES ==="

          BEST_ZIP=""
          BEST_VERSION_CODE=-1
          BEST_VERSION_NAME=""

          FOUND_ZIPS=0

          while IFS= read -r -d '' ZIP_FILE; do
            FOUND_ZIPS=$((FOUND_ZIPS + 1))

            echo ""
            echo "----------------------------------------"
            echo "Checking ZIP: $ZIP_FILE"

            BUILD_FILE_IN_ZIP=$(unzip -Z1 "$ZIP_FILE" 2>/dev/null \
              | grep -E '(^|/)app/build\.gradle\.kts$' \
              | head -1 || true)

            if [ -z "$BUILD_FILE_IN_ZIP" ]; then
              echo "SKIP: app/build.gradle.kts not found"
              continue
            fi

            echo "Build file: $BUILD_FILE_IN_ZIP"

            VERSION_CODE_LINE=$(unzip -p "$ZIP_FILE" "$BUILD_FILE_IN_ZIP" 2>/dev/null \
              | grep -E '^[[:space:]]*versionCode[[:space:]]*=' \
              | head -1 || true)

            VERSION_NAME_LINE=$(unzip -p "$ZIP_FILE" "$BUILD_FILE_IN_ZIP" 2>/dev/null \
              | grep -E '^[[:space:]]*versionName[[:space:]]*=' \
              | head -1 || true)

            if [ -z "$VERSION_CODE_LINE" ]; then
              echo "SKIP: versionCode not found"
              continue
            fi

            VERSION_CODE=$(echo "$VERSION_CODE_LINE" \
              | sed -E 's/[^0-9]*([0-9]+).*/\1/' || true)

            VERSION_NAME=$(echo "$VERSION_NAME_LINE" \
              | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' || true)

            if [ -z "$VERSION_CODE" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "SKIP: invalid versionCode: $VERSION_CODE_LINE"
              continue
            fi

            echo "versionName: $VERSION_NAME"
            echo "versionCode: $VERSION_CODE"

            if [ "$VERSION_CODE" -gt "$BEST_VERSION_CODE" ]; then
              BEST_ZIP="$ZIP_FILE"
              BEST_VERSION_CODE="$VERSION_CODE"
              BEST_VERSION_NAME="$VERSION_NAME"
            fi

          done < <(
            find . -maxdepth 1 -type f \
              -name 'chetchiki_android_final*.zip' \
              -print0
          )

          echo ""
          echo "========================================"
          echo "ZIP FILES FOUND: $FOUND_ZIPS"
          echo "========================================"

          if [ -z "$BEST_ZIP" ]; then
            echo "ERROR: No valid Android ZIP with versionCode found."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SELECTED ZIP"
          echo "========================================"
          echo "Using ZIP: $BEST_ZIP"
          echo "Selected versionName: $BEST_VERSION_NAME"
          echo "Selected versionCode: $BEST_VERSION_CODE"
          echo "========================================"

          rm -rf project
          mkdir -p project

          unzip -q "$BEST_ZIP" -d project

          echo "=== FIND ANDROID PROJECT ==="

          PROJECT_DIR=""

          while IFS= read -r gradlew; do
            DIR="$(dirname "$gradlew")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -d "$DIR/app" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            fi
          done < <(find project -type f -name gradlew)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found."
            echo ""
            echo "Searching for settings.gradle:"
            find project \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print

            echo ""
            echo "Searching for app directories:"
            find project -type d -name app -print

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=== VERIFY SELECTED APP VERSION ==="

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: $BUILD_FILE not found"
            exit 1
          fi

          VERSION_LINE=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' \
            "$BUILD_FILE" | head -1 || true)

          VERSION_CODE_LINE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' \
            "$BUILD_FILE" | head -1 || true)

          if [ -z "$VERSION_LINE" ]; then
            echo "ERROR: versionName not found"
            exit 1
          fi

          if [ -z "$VERSION_CODE_LINE" ]; then
            echo "ERROR: versionCode not found"
            exit 1
          fi

          echo "Detected version: $VERSION_LINE"
          echo "Detected version code: $VERSION_CODE_LINE"

          echo ""
          echo "=== PROJECT ROOT ==="
          echo "$PROJECT_DIR"

          echo ""
          echo "=== PROJECT FILES ==="
          ls -la "$PROJECT_DIR"

          echo ""
          echo "=== APP FILES ==="
          ls -la "$PROJECT_DIR/app"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "Android SDK: $SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          chmod +x gradlew

          echo "=== BEFORE ==="
          cat gradle/wrapper/gradle-wrapper.properties

          sed -i -E \
            's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.9-all.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          echo "=== AFTER ==="
          cat gradle/wrapper/gradle-wrapper.properties

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          rm -rf "$HOME/.gradle/caches"
          rm -rf "$HOME/.gradle/wrapper/dists"
          rm -rf "$HOME/.gradle/wrapper"

          echo "=== INSTALL GRADLE 8.9 ==="

          curl -L -o /tmp/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          rm -rf "$HOME/gradle-8.9"

          unzip -q /tmp/gradle-8.9-bin.zip -d "$HOME"

          "$HOME/gradle-8.9/bin/gradle" --version

      - name: Check Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo ""
          echo "=== PROJECT ==="
          ls -la

          echo ""
          echo "=== APP ==="
          ls -la app

          echo ""
          echo "=== BUILD FILE ==="

          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          elif [ -f app/build.gradle ]; then
            cat app/build.gradle
          else
            echo "Android app build file not found"
            exit 1
          fi

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

          set +e

          "$HOME/gradle-8.9/bin/gradle" clean assembleDebug \
            --stacktrace 2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "================ FIRST ERROR LINES ================"

          grep -n -E \
            "What went wrong|Caused by:|ERROR|error:|Minimum supported|requires|requires Java|JDK|plugin" \
            build.log | head -80 || true

          echo ""
          echo "================ LAST 120 LINES ================"

          tail -120 build.log

          exit $RESULT

      - name: Verify APK version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== APK FILES ==="

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK: $APK"

          echo ""
          echo "=== VERIFY APK PACKAGE ==="

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -20
          else
            echo "aapt not found, skipping APK metadata check"
          fi

          APK="${APK#./}"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chetchiki-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error
