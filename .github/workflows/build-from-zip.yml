name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download ZIP
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e

          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \( -name 'chetchiki_android_final*.zip' -o -name 'chetchiki_android_v*.zip' \) | sort -V | tail -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "=== ZIP CONTENT ==="
          find project -maxdepth 5 -type f | sort | head -300

          PROJECT_DIR=""

          while IFS= read -r gradlew; do
            DIR="$(dirname "$gradlew")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -d "$DIR/app" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            fi
          done < <(find project -type f -name gradlew)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project root not found."
            echo "Searching for settings.gradle and app:"
            find project -name settings.gradle -o -name settings.gradle.kts
            find project -type d -name app
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== PROJECT ROOT ==="
          echo "$PROJECT_DIR"

          echo "=== PROJECT FILES ==="
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "Android SDK: $SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          chmod +x gradlew

          echo "=== BEFORE ==="
          cat gradle/wrapper/gradle-wrapper.properties

          sed -i -E 's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.9-all.zip#' gradle/wrapper/gradle-wrapper.properties

          echo "=== AFTER ==="
          cat gradle/wrapper/gradle-wrapper.properties

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists"
          rm -rf "$HOME/.gradle/wrapper"
          
          echo "=== GRADLE VERSION ==="
          echo "=== INSTALL GRADLE 8.9 ==="
          curl -L -o /tmp/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          rm -rf "$HOME/gradle-8.9"
          unzip -q /tmp/gradle-8.9-bin.zip -d "$HOME"
          "$HOME/gradle-8.9/bin/gradle" --version

      - name: Check Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== PROJECT ==="
          ls -la

          echo "=== APP ==="
          ls -la app

          echo "=== BUILD FILE ==="

          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          elif [ -f app/build.gradle ]; then
            cat app/build.gradle
          else
            echo "Android app build file not found"
            exit 1
          fi

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

          set +e

          "$HOME/gradle-8.9/bin/gradle" clean assembleDebug --stacktrace 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "================ FIRST ERROR LINES ================"
          grep -n -E "What went wrong|Caused by:|ERROR|error:|Minimum supported|requires|requires Java|JDK|plugin" build.log | head -80 || true

          echo ""
          echo "================ LAST 120 LINES ================"
          tail -120 build.log

          exit $RESULT

      - name: Find APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== APK FILES ==="

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -1)

          APK="${APK#./}"
     
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chetchiki-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error
