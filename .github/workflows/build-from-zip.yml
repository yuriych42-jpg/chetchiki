name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Android ZIP by versionCode
        shell: bash
        run: |
          set -e

          BEST_ZIP=""
          BEST_VERSION_CODE=-1
          BEST_VERSION_NAME=""

          echo "=== SEARCH FOR ANDROID ZIP FILES ==="

          while IFS= read -r -d '' ZIP_FILE; do
            echo ""
            echo "Checking: $ZIP_FILE"

            BUILD_FILE=$(unzip -Z1 "$ZIP_FILE" 2>/dev/null \
              | grep -E '(^|/)app/build\.gradle(\.kts)?$' \
              | head -1 || true)

            if [ -z "$BUILD_FILE" ]; then
              echo "SKIP: app/build.gradle(.kts) not found"
              continue
            fi

            echo "Build file: $BUILD_FILE"

            BUILD_CONTENT=$(unzip -p "$ZIP_FILE" "$BUILD_FILE" 2>/dev/null || true)

            VERSION_CODE=$(printf '%s\n' "$BUILD_CONTENT" \
              | grep -E '^[[:space:]]*versionCode[[:space:]]*(=|)[[:space:]]*[0-9]+' \
              | head -1 \
              | grep -oE '[0-9]+' \
              | head -1 || true)

            VERSION_NAME=$(printf '%s\n' "$BUILD_CONTENT" \
              | grep -E '^[[:space:]]*versionName[[:space:]]*=' \
              | head -1 \
              | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' \
              || true)

            if [ -z "$VERSION_CODE" ]; then
              echo "SKIP: versionCode not found"
              continue
            fi

            echo "versionCode: $VERSION_CODE"
            echo "versionName: $VERSION_NAME"

            if [ "$VERSION_CODE" -gt "$BEST_VERSION_CODE" ]; then
              BEST_ZIP="$ZIP_FILE"
              BEST_VERSION_CODE="$VERSION_CODE"
              BEST_VERSION_NAME="$VERSION_NAME"
            fi

          done < <(
            find . -maxdepth 1 -type f \
              -iname '*.zip' \
              -print0
          )

          echo ""
          echo "========================================"
          echo "SELECTED PROJECT"
          echo "========================================"

          if [ -z "$BEST_ZIP" ]; then
            echo "ERROR: No valid Android ZIP found."
            exit 1
          fi

          echo "ZIP: $BEST_ZIP"
          echo "versionName: $BEST_VERSION_NAME"
          echo "versionCode: $BEST_VERSION_CODE"
          echo "========================================"

          if [ "$BEST_VERSION_CODE" -lt 172 ]; then
            echo "ERROR: Selected ZIP is older than version 1.72."
            exit 1
          fi

          rm -rf project
          mkdir -p project

          unzip -q "$BEST_ZIP" -d project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r GRADLEW; do
            DIR="$(dirname "$GRADLEW")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              if [ -d "$DIR/app" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            fi
          done < <(find project -type f -name gradlew)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Verify source version
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          else
            echo "ERROR: Android build file not found"
            exit 1
          fi

          VERSION_CODE=$(grep -E \
            '^[[:space:]]*versionCode[[:space:]]*(=|)[[:space:]]*[0-9]+' \
            "$BUILD_FILE" \
            | head -1 \
            | grep -oE '[0-9]+' \
            | head -1 \
            || true)

          VERSION_NAME=$(grep -E \
            '^[[:space:]]*versionName[[:space:]]*=' \
            "$BUILD_FILE" \
            | head -1 \
            | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' \
            || true)

          echo "SOURCE versionName: $VERSION_NAME"
          echo "SOURCE versionCode: $VERSION_CODE"

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: Could not read versionCode"
            exit 1
          fi

          if [ "$VERSION_CODE" -lt 172 ]; then
            echo "ERROR: Source project is older than 1.72."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.9"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            rm -rf "$GRADLE_DIR"

            unzip -q /tmp/gradle.zip -d "$HOME"

            if [ ! -d "$GRADLE_DIR" ]; then
              echo "ERROR: Gradle 8.9 installation failed"
              exit 1
            fi
          fi

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          "$GRADLE_DIR/bin/gradle" --version

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== USING GRADLE ==="
          gradle --version

          echo ""
          echo "=== BUILD ==="

          gradle clean assembleDebug --stacktrace

      - name: Verify APK version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== APK FILES ==="

          find . -type f -name '*.apk' -print

          APK=$(find . -type f -name '*.apk' | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo ""
          echo "APK: $APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"

          if [ -x "$AAPT" ]; then
            echo ""
            echo "=== APK VERSION ==="

            "$AAPT" dump badging "$APK" | grep -E '^package:'
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chetchiki-apk-1.72
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error
