name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download ZIP
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP_FILE="./chetchiki_android_v0_7_gradle89.zip"
          test -f "$ZIP_FILE"
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -maxdepth 2 -name gradlew -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fix Gradle version
        run: |
          sed -i 's/gradle-8\.7[^"]*\.zip/gradle-8.9-all.zip/g' "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          echo "Gradle wrapper:"
          cat "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
      
      - name: Fix Java and Kotlin target
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          text = p.read_text()

          marker = "    buildFeatures { compose=true }"

          insert = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text = text.replace(marker, insert + marker)
              p.write_text(text)

          print(p.read_text())
          PY
      
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chetchiki-apk
          path: project/**/app/build/outputs/apk/debug/*.apk
