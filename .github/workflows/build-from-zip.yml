name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Android ZIP by versionCode
        shell: bash
        run: |
          set -e

          echo "=== SEARCH FOR ANDROID ZIP FILES ==="

          BEST_ZIP=""
          BEST_VERSION_CODE=-1
          BEST_VERSION_NAME=""

          while IFS= read -r -d '' ZIP_FILE; do
            echo ""
            echo "----------------------------------------"
            echo "Checking ZIP: $ZIP_FILE"

            BUILD_FILE_IN_ZIP=$(unzip -Z1 "$ZIP_FILE" 2>/dev/null \
              | grep -E '(^|/)app/build\.gradle(\.kts)?$' \
              | head -1 || true)

            if [ -z "$BUILD_FILE_IN_ZIP" ]; then
              echo "SKIP: Android app build file not found"
              continue
            fi

            echo "Build file: $BUILD_FILE_IN_ZIP"

            VERSION_CODE_LINE=$(unzip -p "$ZIP_FILE" "$BUILD_FILE_IN_ZIP" 2>/dev/null \
              | grep -E '^[[:space:]]*versionCode[[:space:]]*=' \
              | head -1 || true)

            VERSION_NAME_LINE=$(unzip -p "$ZIP_FILE" "$BUILD_FILE_IN_ZIP" 2>/dev/null \
              | grep -E '^[[:space:]]*versionName[[:space:]]*=' \
              | head -1 || true)

            if [ -z "$VERSION_CODE_LINE" ]; then
              echo "SKIP: versionCode not found"
              continue
            fi

            VERSION_CODE=$(echo "$VERSION_CODE_LINE" \
              | sed -E 's/[^0-9]*([0-9]+).*/\1/')

            VERSION_NAME=$(echo "$VERSION_NAME_LINE" \
              | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

            if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "SKIP: invalid versionCode"
              continue
            fi

            echo "versionName: $VERSION_NAME"
            echo "versionCode: $VERSION_CODE"

            if [ "$VERSION_CODE" -gt "$BEST_VERSION_CODE" ]; then
              BEST_ZIP="$ZIP_FILE"
              BEST_VERSION_CODE="$VERSION_CODE"
              BEST_VERSION_NAME="$VERSION_NAME"
            fi

          done < <(
            find . -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.ZIP' \) \
              -print0
          )

          echo ""
          echo "========================================"
          echo "SELECTED ZIP"
          echo "========================================"

          if [ -z "$BEST_ZIP" ]; then
            echo "ERROR: No valid Android ZIP found."
            echo ""
            echo "ZIP files found:"
            find . -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.ZIP' \) \
              -print
            exit 1
          fi

          echo "ZIP: $BEST_ZIP"
          echo "versionName: $BEST_VERSION_NAME"
          echo "versionCode: $BEST_VERSION_CODE"

          if [ "$BEST_VERSION_CODE" -lt 172 ]; then
            echo ""
            echo "ERROR: Selected project is older than version 1.72."
            echo "Refusing to build old APK."
            exit 1
          fi

          rm -rf project
          mkdir -p project

          unzip -q "$BEST_ZIP" -d project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r gradlew; do
            DIR="$(dirname "$gradlew")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -d "$DIR/app" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            fi
          done < <(find project -type f -name gradlew)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found."

            echo ""
            echo "settings.gradle files:"
            find project \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print

            echo ""
            echo "gradlew files:"
            find project -type f -name gradlew -print

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify source version
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          else
            echo "ERROR: Android build file not found"
            exit 1
          fi

          echo "=== BUILD FILE ==="
          cat "$BUILD_FILE"

          VERSION_CODE_LINE=$(grep -E \
            '^[[:space:]]*versionCode[[:space:]]*=' \
            "$BUILD_FILE" \
            | head -1 || true)

          VERSION_NAME_LINE=$(grep -E \
            '^[[:space:]]*versionName[[:space:]]*=' \
            "$BUILD_FILE" \
            | head -1 || true)

          VERSION_CODE=$(echo "$VERSION_CODE_LINE" \
            | sed -E 's/[^0-9]*([0-9]+).*/\1/')

          VERSION_NAME=$(echo "$VERSION_NAME_LINE" \
            | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          echo ""
          echo "SOURCE versionName: $VERSION_NAME"
          echo "SOURCE versionCode: $VERSION_CODE"

          if [ -z "$VERSION_CODE" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not read versionCode"
            exit 1
          fi

          if [ "$VERSION_CODE" -lt 172 ]; then
            echo ""
            echo "ERROR: This is still an old project."
            echo "Expected versionCode >= 172."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "Android SDK: $SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          chmod +x gradlew

          echo "=== GRADLE WRAPPER ==="
          cat gradle/wrapper/gradle-wrapper.properties

          sed -i -E \
            's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.9-all.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          echo "=== UPDATED GRADLE WRAPPER ==="
          cat gradle/wrapper/gradle-wrapper.properties

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== APK FILES ==="

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo ""
          echo "APK: $APK"

          if command -v aapt >/dev/null 2>&1; then
            echo ""
            echo "=== APK VERSION ==="

            aapt dump badging "$APK" \
              | grep -E 'package:|versionCode|versionName' \
              | head -5
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chetchiki-apk-1.72
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error
```
