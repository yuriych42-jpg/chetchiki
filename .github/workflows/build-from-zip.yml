name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download ZIP
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="./chetchiki_android_final2.zip"

          test -f "$ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -maxdepth 3 -name gradlew -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "gradlew not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ВАЖНО:
      # setup-android здесь специально НЕ используется.
      # Android SDK уже установлен на GitHub runner.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "Android SDK: $SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Gradle version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.9-bin.zip#g' \
              gradle/wrapper/gradle-wrapper.properties
          fi

          chmod +x gradlew

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable AndroidX
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Check project files
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort | head -200

          echo "=== GRADLE ==="
          ./gradlew --version

      - name: Fix Java and Kotlin target
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          if not p.exists():
              print("app/build.gradle not found")
              raise SystemExit(1)

          s = p.read_text()

          if "compileOptions" not in s:
              s += '''

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          '''

          if "kotlinOptions" not in s:
              s += '''

          kotlinOptions {
              jvmTarget = "17"
          }
          '''

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chetchiki-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error
